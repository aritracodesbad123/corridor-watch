<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corridor Watch — Investigation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1419; --panel:#171C24; --panel2:#1C2430; --line:#2A3344;
    --text:#E8ECF1; --muted:#8B95A8; --teal:#3FA796; --teal-dim:#1A3D38;
    --amber:#E0A04A; --amber-dim:#4A3A1F; --red:#D36B55; --red-dim:#3A221C;
    --green:#5BAF7A;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);font-family:'Source Sans 3',sans-serif;font-size:13.5px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);background:#12171F}
  header h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.3px}
  header .tag{color:var(--muted);font-size:11.5px;font-family:'IBM Plex Mono',monospace}
  header .meta{display:flex;gap:10px;align-items:center}
  .chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted)}
  .chip.on{border-color:var(--teal);color:var(--teal)}
  .layout{display:grid;grid-template-columns:340px 1fr 320px;height:calc(100vh - 49px)}
  .queue,.side{border-right:1px solid var(--line);overflow-y:auto;background:#12171F}
  .side{border-right:none;border-left:1px solid var(--line)}
  .section-h{padding:10px 14px;color:var(--muted);font-size:11px;letter-spacing:.4px;text-transform:uppercase;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:hover{background:#1A222E}
  .row.active{background:#1A2A33;border-left:3px solid var(--teal);padding-left:11px}
  .risk-bar{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;flex-shrink:0}
  .risk-hi{background:var(--red-dim);color:var(--red)}
  .risk-mid{background:var(--amber-dim);color:var(--amber)}
  .risk-lo{background:var(--teal-dim);color:var(--teal)}
  .row-corridor{font-family:'IBM Plex Mono',monospace;font-size:12px}
  .row-sub{color:var(--muted);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pat{font-size:10.5px;color:var(--amber);font-family:'IBM Plex Mono',monospace;margin-top:2px}
  .detail{padding:18px 22px;overflow-y:auto}
  .empty{color:var(--muted);padding:48px 20px}
  .case-id{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:11.5px}
  .amount{font-size:26px;font-weight:700;font-family:'IBM Plex Mono',monospace;margin:4px 0}
  .muted{color:var(--muted)}
  .flow{display:flex;align-items:center;gap:12px;margin:14px 0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
  .node{flex:1;min-width:0}
  .node .id{font-family:'IBM Plex Mono',monospace;font-size:12px}
  .node .age{color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:12px 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .card h3{margin:0 0 8px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:2px 0}
  .kv span:last-child{font-family:'IBM Plex Mono',monospace;color:var(--text);text-align:right}
  button,.btn{background:var(--teal);color:#06201C;border:none;padding:9px 14px;border-radius:5px;font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
  button:disabled{background:#2A3344;color:var(--muted);cursor:wait}
  button.danger{background:var(--red-dim);color:var(--red);border:1px solid #5A3228}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .verdict{margin-top:12px;padding:14px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
  .verdict.high{border-color:#5A3228}.verdict.medium{border-color:var(--amber-dim)}.verdict.low{border-color:var(--teal-dim)}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:2px 8px;border-radius:3px;text-transform:uppercase}
  .pill.high{background:var(--red-dim);color:var(--red)}
  .pill.medium{background:var(--amber-dim);color:var(--amber)}
  .pill.low{background:var(--teal-dim);color:var(--teal)}
  .net{height:320px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;position:relative;overflow:hidden;margin:10px 0}
  .net.tall{height:360px}
  .net svg{width:100%;height:100%;display:block}
  .viz-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-top:6px}
  .viz-legend span{display:inline-flex;align-items:center;gap:6px}
  .viz-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .flow-label{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:#C9D0DC}
  @keyframes dashflow{to{stroke-dashoffset:-24}}
  .edge-flow{stroke-dasharray:6 6;animation:dashflow 1s linear infinite}
  .edge-flow-hi{stroke-dasharray:8 6;animation:dashflow .7s linear infinite}
  .map-ocean{fill:#141C28}
  .map-land{fill:#1E2A3A;stroke:#2F3D52;stroke-width:0.6}
  .dag{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
  .dag-step{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;padding:4px 0;border-bottom:1px solid #222A38}
  .dag-n{font-family:'IBM Plex Mono',monospace;color:var(--teal);width:18px;flex-shrink:0}
  .bar{height:6px;background:#243041;border-radius:3px;overflow:hidden;margin-top:4px}
  .bar>i{display:block;height:100%;background:var(--amber)}
  textarea,select,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:5px;padding:8px;font-family:inherit;font-size:12.5px}
  .audit{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);max-height:200px;overflow:auto;line-height:1.45}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:0 -22px 14px;padding:0 22px}
  .tab{padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
  .tab.on{color:var(--text);border-bottom-color:var(--teal)}
  .panel-block{display:none}.panel-block.on{display:block}
  .side .card{margin:10px;border-radius:6px}
  .side .btn-row{padding:0 10px 10px}
  ul.tight{margin:6px 0;padding-left:16px} ul.tight li{margin:4px 0}
  .flow-node{cursor:pointer}
  .flow-node:hover rect{stroke-width:2.5;filter:brightness(1.15)}
  .node-tooltip{position:fixed;pointer-events:none;background:#0B0F14;border:1px solid var(--line);
    border-radius:6px;padding:9px 11px;font-family:'IBM Plex Mono',monospace;font-size:11px;
    color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:1000;max-width:260px;
    display:none;line-height:1.5}
  .node-tooltip .tt-title{font-weight:700;color:var(--teal);margin-bottom:5px;font-size:12px}
  .node-tooltip .tt-row{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
  .node-tooltip .tt-row span:last-child{color:var(--text);text-align:right}
  @media (max-width:1100px){
    .layout{grid-template-columns:280px 1fr}
    .side{display:none}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Corridor Watch</h1>
    <div class="tag">cross-border payment fraud investigation — synthetic data</div>
  </div>
  <div class="meta">
    <span class="chip" id="gemini-chip">gemini: …</span>
    <select id="user-role" style="width:auto;padding:4px 8px;font-size:11px">
      <option value="analyst">Role: Compliance Analyst</option>
      <option value="fiu_lead">Role: FIU Team Lead</option>
      <option value="mrm_auditor">Role: MRM Auditor</option>
    </select>
    <button class="secondary" id="btn-export" type="button" disabled>Export case</button>
    <button class="secondary" id="btn-mrm" type="button">MRM draft</button>
    <button class="secondary" id="btn-mined-rules" type="button">Mined rules</button>
    <button class="secondary" id="btn-redteam" type="button">Run red-team</button>
    <button class="secondary" id="btn-redteam-reset" type="button">Reset dataset</button>
  </div>
</header>
<div class="layout">
  <div class="queue">
    <div class="section-h"><span id="queue-count">Loading…</span><span id="pattern-filter-label"></span></div>
    <div id="rows"></div>
  </div>
  <div class="detail" id="detail"><div class="empty">Select a flagged transaction to open the case.</div></div>
  <div class="side" id="side">
    <div class="section-h"><span>Case tools</span></div>
    <div class="card"><h3>Phase 2</h3>
      <p class="muted" style="margin:0 0 8px;font-size:12px">Analyst-facing drafts only — never automated decisions.</p>
      <div class="btn-row" style="padding:0">
        <button class="secondary" id="side-sof" type="button" disabled>SoF check</button>
        <button class="secondary" id="side-mem" type="button" disabled>Precedents</button>
      </div>
      <div id="side-out" class="muted" style="font-size:12px"></div>
    </div>
    <div class="card"><h3>Audit trail</h3><div class="audit" id="side-audit">Open a case to load audit events.</div></div>
  </div>
</div>

<div class="node-tooltip" id="node-tooltip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
const API = "/api";
let alerts = [];
let current = null;
let currentDetail = null;

const $ = (id) => document.getElementById(id);

async function health(){
  try{
    const h = await (await fetch(`${API}/health`)).json();
    const chip = $("gemini-chip");
    chip.textContent = h.gemini ? "gemini: ready" : "gemini: off (deterministic)";
    chip.classList.toggle("on", !!h.gemini);
  }catch(e){ $("gemini-chip").textContent = "api offline"; }
}

function riskClass(s){ return s>=80?'risk-hi':(s>=50?'risk-mid':'risk-lo'); }
function pillClass(l){ return (l||'').toLowerCase(); }

async function loadAlerts(){
  const res = await fetch(`${API}/alerts`);
  alerts = await res.json();
  $("queue-count").textContent = `${alerts.length} alerts`;
  $("rows").innerHTML = alerts.map(a => `
    <div class="row" data-id="${a.txn_id}">
      <div class="risk-bar ${riskClass(a.risk_score)}">${Math.round(a.risk_score)}</div>
      <div style="min-width:0">
        <div class="row-corridor">${a.corridor} · $${Number(a.amount).toLocaleString()}</div>
        <div class="row-sub">${a.sender_id} → ${a.receiver_id}</div>
        <div class="pat">${a.primary_pattern||''}</div>
      </div>
    </div>`).join("");
  $("rows").querySelectorAll(".row").forEach(r => r.addEventListener("click", () => openCase(r.dataset.id)));
}

function fmtFeatures(ctx){
  const f = ctx.risk_features||{};
  if(f.account_age_days===undefined) return "external account";
  return `age ${f.account_age_days}d · fan-in ${f.fan_in_count} · PT ${f.pass_through_ratio} · hold ${f.avg_hold_time_minutes}m · devices ${f.shared_device_count}`;
}

function sessionCard(sessions){
  if(!sessions||!sessions.length) return `<div class="muted">No sessions</div>`;
  const s = sessions[0];
  return `
    <div class="kv"><span>bot likelihood</span><span>${s.bot_likelihood}</span></div>
    <div class="bar"><i style="width:${Math.min(100,s.bot_likelihood*100)}%"></i></div>
    <div class="kv"><span>copy-paste risk</span><span>${s.copy_paste_risk}</span></div>
    <div class="kv"><span>typing deviation</span><span>${s.typing_deviation}</span></div>
    <div class="kv"><span>nav velocity</span><span>${s.navigation_velocity}</span></div>
    <div class="kv"><span>geo mismatch</span><span>${s.geo_mismatch?'yes':'no'}</span></div>`;
}

function money(n){
  const v = Number(n||0);
  if(v >= 1000) return `$${(v/1000).toFixed(v>=10000?0:1)}k`;
  return `$${Math.round(v)}`;
}

// ---- safe binary-to-text encoding for embedding JSON in HTML attributes ----
function encodeNodeData(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
}
function decodeNodeData(str){
  return JSON.parse(decodeURIComponent(escape(atob(str))));
}

function buildTooltipHtml(n){
  const shown = new Set(["id","country","risk_score","focus","external","layer"]);
  const title = n.id || "Account";
  let rows = "";
  const addRow = (label, val) => { rows += `<div class="tt-row"><span>${label}</span><span>${val}</span></div>`; };

  addRow("country", n.country || "—");
  addRow("risk score", n.risk_score ?? "—");
  addRow("role", n.focus ? "focal account" : (n.external ? "external counterparty" : "related account"));
  if(n.layer !== undefined) addRow("hop depth", n.layer);

  // Any other numeric/string fields the backend attached to this node —
  // shown generically so new risk features surface automatically.
  Object.keys(n).forEach(k=>{
    if(shown.has(k)) return;
    const v = n[k];
    if(v===null || v===undefined || typeof v==="object") return;
    addRow(k.replace(/_/g," "), v);
  });

  return `<div class="tt-title">${title}</div>${rows}`;
}

function attachFlowTooltips(container){
  const tip = $("node-tooltip");
  if(!container || !tip) return;
  container.querySelectorAll(".flow-node").forEach(g=>{
    g.addEventListener("mouseenter", ()=>{
      let info;
      try{ info = decodeNodeData(g.dataset.node); }catch(e){ return; }
      tip.innerHTML = buildTooltipHtml(info);
      tip.style.display = "block";
    });
    g.addEventListener("mousemove", (e)=>{
      const pad = 16;
      let x = e.clientX + pad, y = e.clientY + pad;
      if(x > window.innerWidth - 280) x = e.clientX - pad - 260;
      if(y > window.innerHeight - 160) y = e.clientY - pad - 120;
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    });
    g.addEventListener("mouseleave", ()=>{ tip.style.display = "none"; });
  });
}

function renderMoneyFlowDag(net){
  const dag = net.flow_dag || net;
  const nodes = [...(dag.nodes||[])];
  const edges = dag.edges||[];
  if(!nodes.length) return `<div class="muted" style="padding:24px">No flow graph for this case.</div>`;

  const W = 920, H = 340, padX = 70, padY = 36;
  const maxLayer = Math.max(...nodes.map(n => n.layer||0), 1);
  const byLayer = {};
  nodes.forEach(n => {
    const L = n.layer||0;
    (byLayer[L] ||= []).push(n);
  });
  Object.values(byLayer).forEach(arr => arr.sort((a,b)=>(b.focus-a.focus)||(b.risk_score-a.risk_score)));

  const positions = {};
  Object.entries(byLayer).forEach(([L, arr])=>{
    const layer = Number(L);
    const x = padX + (layer / maxLayer) * (W - padX*2);
    arr.forEach((n,i)=>{
      const y = arr.length===1 ? H/2 : padY + (i/(arr.length-1))*(H-padY*2);
      positions[n.id] = {x, y, n};
    });
  });

  const defs = `
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#7A879C"/>
      </marker>
      <marker id="arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#E0A04A"/>
      </marker>
    </defs>`;

  const edgeSvg = edges.map(e=>{
    const a = positions[e.source], b = positions[e.target];
    if(!a||!b) return "";
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx,dy)||1;
    const shrink = 18;
    const x1 = a.x + dx/len*shrink, y1 = a.y + dy/len*shrink;
    const x2 = b.x - dx/len*shrink, y2 = b.y - dy/len*shrink;
    const midX = (x1+x2)/2, midY = (y1+y2)/2 - (e.highlight?10:4);
    const stroke = e.highlight ? "#E0A04A" : "#4A5870";
    const sw = e.highlight ? Math.min(5, 1.5 + Math.log10((e.amount||1)+1)) : Math.min(3.5, 1 + Math.log10((e.amount||1)+1)*0.7);
    const cls = e.highlight ? "edge-flow-hi" : "edge-flow";
    return `<path d="M${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}" fill="none" stroke="${stroke}" stroke-width="${sw}"
              marker-end="url(#${e.highlight?'arrow-hi':'arrow'})" class="${cls}" opacity="${e.highlight?1:0.75}"/>
      <text class="flow-label" x="${midX}" y="${midY-6}" text-anchor="middle">${money(e.amount)}</text>`;
  }).join("");

  const nodeSvg = nodes.map(n=>{
    const p = positions[n.id]; if(!p) return "";
    const risk = n.risk_score||0;
    const fill = n.focus ? "#3FA796" : (risk>=70 ? "#8B3E32" : (n.external ? "#2A3344" : "#2F3F55"));
    const stroke = n.focus ? "#7EE0D0" : "#6A7A90";
    const label = (n.id||"").slice(0,8);
    const sub = n.country || "?";
    const nodeData = encodeNodeData(n);
    return `<g class="flow-node" data-node="${nodeData}">
      <rect x="${p.x-34}" y="${p.y-18}" rx="6" width="68" height="36" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>
      <text x="${p.x}" y="${p.y-2}" text-anchor="middle" fill="#E8ECF1" font-size="10" font-family="IBM Plex Mono">${label}</text>
      <text x="${p.x}" y="${p.y+12}" text-anchor="middle" fill="#A8B2C2" font-size="9" font-family="IBM Plex Mono">${sub} · ${Math.round(risk)}</text>
    </g>`;
  }).join("");

  const layerLabels = Object.keys(byLayer).map(L=>{
    const x = padX + (Number(L)/maxLayer)*(W-padX*2);
    return `<text x="${x}" y="16" text-anchor="middle" fill="#6B778A" font-size="10" font-family="IBM Plex Mono">hop ${L}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}">${defs}${layerLabels}${edgeSvg}${nodeSvg}</svg>`;
}

// ---------------------------------------------------------------------
// Real-world corridor map (D3 geo + public world-atlas topology, cached)
// ---------------------------------------------------------------------
const WORLD_ATLAS_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
let _worldFeatures = null;

async function getWorldFeatures(){
  if(_worldFeatures) return _worldFeatures;
  const topo = await (await fetch(WORLD_ATLAS_URL)).json();
  _worldFeatures = topojson.feature(topo, topo.objects.countries).features;
  return _worldFeatures;
}

function buildProjection(W, H){
  const frame = {
    type: "Polygon",
    coordinates: [[[-120,-15],[150,-15],[150,50],[-120,50],[-120,-15]]]
  };
  const projection = d3.geoMercator();
  projection.fitExtent([[24,24],[W-24,H-24]], frame);
  return projection;
}

async function renderCorridorMap(geo){
  const W = 920, H = 360;
  let features = [];
  try{
    features = await getWorldFeatures();
  }catch(e){
    return `<svg viewBox="0 0 ${W} ${H}"><rect class="map-ocean" width="${W}" height="${H}"/>
      <text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#8B95A8">Map data unavailable (offline?)</text></svg>`;
  }

  const projection = buildProjection(W, H);
  const path = d3.geoPath(projection);

  const landSvg = features.map(f => {
    const d = path(f);
    return d ? `<path class="map-land" d="${d}"/>` : "";
  }).join("");

  const countries = geo?.countries || [];
  const flows = geo?.flows || [];
  const maxAmt = Math.max(...flows.map(f=>f.amount||0), 1);

  const arcSvg = flows.map(f=>{
    const a = projection([f.source_lon, f.source_lat]);
    const b = projection([f.target_lon, f.target_lat]);
    if(!a || !b) return "";
    const mx = (a[0]+b[0])/2;
    const my = Math.min(a[1],b[1]) - 30 - (f.highlight?20:0) - Math.abs(a[0]-b[0])*0.08;
    const sw = 1.2 + 4 * (f.amount/maxAmt);
    const col = f.highlight ? "#E0A04A" : "#3FA796";
    const cls = f.highlight ? "edge-flow-hi" : "edge-flow";
    return `<path d="M${a[0]} ${a[1]} Q ${mx} ${my} ${b[0]} ${b[1]}" fill="none" stroke="${col}" stroke-width="${sw}"
              opacity="0.9" class="${cls}"/>
      <text class="flow-label" x="${mx}" y="${my+4}" text-anchor="middle">${f.source}→${f.target} ${money(f.amount)}</text>`;
  }).join("");

  const nodeSvg = countries.map(c=>{
    const p = projection([c.lon, c.lat]);
    if(!p) return "";
    const r = c.focus ? 9 : 6;
    const fill = c.focus ? "#E0A04A" : "#3FA796";
    return `<g>
      <circle cx="${p[0]}" cy="${p[1]}" r="${r+4}" fill="${fill}" opacity="0.2"/>
      <circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${fill}" stroke="#0F1419" stroke-width="1.5"/>
      <text x="${p[0]}" y="${p[1]-12}" text-anchor="middle" fill="#E8ECF1" font-size="11" font-family="IBM Plex Mono" font-weight="600">${c.country}</text>
      <text x="${p[0]}" y="${p[1]+22}" text-anchor="middle" fill="#8B95A8" font-size="9" font-family="IBM Plex Mono">${c.label}</text>
    </g>`;
  }).join("");

  const ocean = `<rect class="map-ocean" width="${W}" height="${H}"/>`;

  if(!countries.length){
    return `<svg viewBox="0 0 ${W} ${H}">${ocean}${landSvg}
      <text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#8B95A8">No corridor geography for this case</text></svg>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}">${ocean}${landSvg}${arcSvg}${nodeSvg}</svg>`;
}

function geoSummary(geo){
  const flows = [...(geo?.flows||[])].sort((a,b)=>b.amount-a.amount);
  if(!flows.length) return `<div class="muted">No cross-border arcs in neighborhood.</div>`;
  return flows.slice(0,6).map(f=>`
    <div class="kv"><span>${f.source} → ${f.target} · ${f.count} txns</span><span>${money(f.amount)}</span></div>
  `).join("");
}

function patternBars(risk){
  let ps = risk.pattern_scores||{};
  if(typeof ps==="string"){ try{ps=JSON.parse(ps)}catch(e){ps={}} }
  const entries = Object.entries(ps).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div class="muted">No pattern scores</div>`;
  return entries.map(([k,v])=>`
    <div class="kv"><span>${k}</span><span>${v}</span></div>
    <div class="bar"><i style="width:${Math.min(100,v)}%"></i></div>`).join("");
}

      <div class="dag">${data.dag.trace.map((s,i)=>`<div class="dag-step"><div class="dag-n">${i+1}</div>
        <div><b>${s.step}</b> · ${s.status}<div class="muted">${s.description||''}</div></div></div>`).join("")}</div></div>`;
  }
}

function renderDecisions(list){
  const el = $("decision-list");
  if(!el) return;
  if(!list.length){ el.innerHTML = `<div class="muted" style="margin-top:8px">No decisions yet.</div>`; return; }
  el.innerHTML = `<h3 style="margin:12px 0 6px;font-size:11px;color:var(--muted)">HISTORY</h3>` +
    list.map(d=>`<div class="kv"><span>${d.decision}</span><span>${new Date(d.decided_at).toLocaleString()}</span></div>
      <div class="muted" style="margin-bottom:6px">${d.notes||''}</div>`).join("");
}

async function loadAudit(txnId){
  const rows = await (await fetch(`${API}/alerts/${txnId}/audit`)).json();
  $("side-audit").innerHTML = rows.slice(-40).map(r=>
    `<div>[${r.event_type}] ${r.actor} · ${new Date(r.ts).toLocaleTimeString()}</div>`
  ).join("") || "No events yet.";
}

$("side-sof").onclick = async ()=>{
  if(!current) return;
  $("side-out").textContent = "Running SoF check…";
  const explanation = currentDetail?.transaction?.source_of_funds || "";
  const res = await fetch(`${API}/phase2/sof/${current}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({explanation, use_llm:true})
  });
  const data = await res.json();
  $("side-out").innerHTML = `<div><b>${data.plausibility}</b> · ${data.severity}</div>
    <ul class="tight">${(data.inconsistencies||[]).map(i=>`<li>${i.code}: ${i.detail}</li>`).join("")||'<li>No inconsistencies</li>'}</ul>
    ${data.draft_narrative?`<p>${data.draft_narrative}</p>`:''}`;
  loadAudit(current);
};

$("side-mem").onclick = async ()=>{
  if(!current) return;
  $("side-out").textContent = "Retrieving precedents…";
  const data = await (await fetch(`${API}/phase2/memory/${current}`)).json();
  $("side-out").innerHTML = `<p>${data.summary}</p><ul class="tight">${
    (data.precedents||[]).map(p=>`<li><b>${p.pattern}</b> (${p.similarity}) — ${p.outcome}<br><span class="muted">${p.summary}</span></li>`).join("")
  }</ul>`;
};

$("btn-mrm").onclick = async ()=>{
  const data = await (await fetch(`${API}/phase2/mrm`)).json();
  const w = window.open("","mrm");
  w.document.write(`<pre style="white-space:pre-wrap;font-family:ui-monospace,monospace;padding:24px">${
    JSON.stringify(data,null,2).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
  }</pre>`);
};

$("btn-mined-rules").onclick = async ()=>{
  const data = await (await fetch(`${API}/phase2/rules/mine`)).json();
  const w = window.open("","rules");
  w.document.write(`<pre style="white-space:pre-wrap;font-family:ui-monospace,monospace;padding:24px">${
    JSON.stringify(data,null,2).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))
  }</pre>`);
};

$("btn-redteam").onclick = async ()=>{
  if(!confirm("Inject adversarial scenarios into the local DB and re-score?")) return;
  $("btn-redteam").disabled = true; $("btn-redteam").textContent = "Red-teaming…";
  try{
    const data = await (await fetch(`${API}/phase2/redteam`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({include_llm:false, max_scenarios:3})
    })).json();
    alert(`Red-team done: ${data.detected} detected / ${data.evaded} evaded of ${data.ran}`);
    await loadAlerts();
  }finally{
    $("btn-redteam").disabled = false; $("btn-redteam").textContent = "Run red-team";
  }
};

$("btn-redteam-reset").onclick = async ()=>{
  if(!confirm("Wipe red-team test injections and restore dataset to clean synthetic baseline?")) return;
  $("btn-redteam-reset").disabled = true; $("btn-redteam-reset").textContent = "Resetting…";
  try{
    const data = await (await fetch(`${API}/phase2/redteam/reset`, { method: "POST" })).json();
    alert(data.message || "Dataset reset to clean baseline.");
    await loadAlerts();
  }finally{
    $("btn-redteam-reset").disabled = false; $("btn-redteam-reset").textContent = "Reset dataset";
  }
};

health();
loadAlerts();
</script>
</body>
</html>
